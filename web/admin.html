<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComfyUI 控制台 · 管理</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0d0d11;--panel:#15151b;--panel2:#1c1c24;--line:#282833;
    --text:#eeeef4;--muted:#85858f;--accent:#5b7cfa;--ok:#37c98b;--warn:#e0a33e;
  }
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  .top{height:50px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .top b{font-weight:600;font-size:15px}
  .top .addr{margin-left:auto;color:var(--muted);font-size:12px}
  .top .addr code{background:var(--panel2);padding:3px 7px;border-radius:5px;color:var(--accent)}
  .cols{flex:1;display:flex;min-height:0}
  aside{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  .tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .tools .row{display:flex;gap:6px}
  .tools input[type=text]{flex:1;min-width:0}
  #list{flex:1;overflow:auto;padding:6px}
  .grp{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;
    padding:10px 8px 6px;letter-spacing:.03em}
  .grp::after{content:"";flex:1;height:1px;background:var(--line)}
  .grp .gmv{display:flex;gap:2px;flex:none}
  .grp .gmv button{width:16px;height:14px;font-size:8px;line-height:1;padding:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:3px;cursor:pointer}
  .grp .gmv button:hover{color:var(--text);border-color:#3a3a48}
  .it{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer}
  .it:hover{background:var(--panel2)}
  .it.on{background:#22304f}
  .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .it .mv{display:flex;gap:2px;flex:none}
  .it .mv button{width:16px;height:16px;font-size:9px;line-height:1;padding:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:3px;cursor:pointer}
  .it .mv button:hover{color:var(--text);border-color:#3a3a48}
  .it .mv .del:hover{color:#ff8585;border-color:#5b2429;background:#2a1416}
  section{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .scroll{flex:1;overflow:auto;padding:18px 22px 24px;min-height:0}
  h2{margin:0 0 14px;font-size:16px;font-weight:500;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input[type=text],input[type=number],select{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:8px 10px;font:inherit;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .grid3{display:grid;grid-template-columns:1fr 200px 110px;gap:12px;margin-bottom:18px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);
    padding:8px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid #1f1f28;vertical-align:middle}
  tr.sel td{background:#17203a}
  tr:hover td{background:#191922}
  td.c{width:36px;text-align:center}
  td.o{width:54px}
  td.o .ord{display:flex;gap:2px;justify-content:center}
  td.o .ord button{width:21px;height:18px;font-size:10px;line-height:1;padding:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:3px;cursor:pointer}
  td.o .ord button:hover{color:var(--text);border-color:#3a3a48}
  td.o .seq{display:block;text-align:center;color:var(--muted);font-size:11px}
  td.k{width:150px;color:var(--muted);font-size:11px;font-family:ui-monospace,Consolas,monospace}
  td.t{width:64px;color:var(--muted);font-size:11px}
  td.v{width:220px}
  td.v input,td.v select{font-size:12px;padding:5px 7px}
  td.n input{font-size:13px;padding:6px 8px}
  .bar{flex:none;padding:12px 22px;border-top:1px solid var(--line);
    background:var(--panel);display:flex;gap:10px;align-items:center}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 20px;
    font:inherit;font-weight:500;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .hint{color:var(--muted);font-size:12px}
  .msg{margin-left:auto;font-size:12px;color:var(--ok)}
  .empty{color:var(--muted);padding:40px 10px;text-align:center;line-height:1.8}
  .sw{position:relative;width:34px;height:19px;background:#33333f;border-radius:10px;
    cursor:pointer;transition:background .15s;display:inline-block}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
    border-radius:50%;background:#8a8a95;transition:.15s}
  .sw.on{background:var(--accent)}
  .sw.on::after{left:17px;background:#fff}
  .cnt{color:var(--muted);font-size:12px;margin:4px 0 0}
</style>
</head>
<body>
<div class="top">
  <b>ComfyUI 控制台 · 管理</b>
  <span class="addr">手机端 <code id="addr">—</code></span>
</div>
<div class="cols">
  <aside>
    <div class="tools">
      <div class="row">
        <input type="text" id="impCat" placeholder="分类（可留空）">
        <button class="btn ghost" id="impBtn">导入 JSON</button>
      </div>
      <input type="file" id="impFile" accept=".json,application/json" multiple hidden>
      <div class="row">
        <button class="btn ghost" id="refreshBtn" style="flex:1">刷新节点信息</button>
      </div>
      <div class="hint" id="refHint">导入 ComfyUI 导出的 <b>API 格式</b> 工作流；装了新模型 / LoRA 后点「刷新节点信息」</div>
    </div>
    <div id="list"><div class="empty">加载中…</div></div>
  </aside>
  <section id="editor">
    <div class="empty">从左边选一个工作流开始配置</div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
let items = [], curId = null, curFields = [], curMeta = {};

function msg(t, bad){
  const m = $('#msg');
  if(!m) return;
  m.textContent = t;
  m.style.color = bad ? '#ff8a8a' : 'var(--ok)';
  clearTimeout(m._h);
  m._h = setTimeout(()=>{ m.textContent=''; }, 2600);
}
function api(path, opt){
  return fetch(path, opt).then(async r=>{
    const t = await r.text();
    let d; try{ d = JSON.parse(t); }catch(e){ throw new Error(t.slice(0,200) || ('HTTP '+r.status)); }
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    return d;
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadList(keep){
  try{
    const d = await api('/api/admin/list');
    items = d.items;
    const groups = new Map();
    items.forEach(it=>{
      if(!groups.has(it.category)) groups.set(it.category, []);
      groups.get(it.category).push(it);
    });
    let h = '', idx = 0;
    for(const [cat, arr] of groups){
      h += `<div class="grp"><span>${esc(cat || '未分类')}</span><span class="gmv"><button data-gmv="up" data-g="${esc(cat || '未分类')}" title="整组上移">▲</button><button data-gmv="down" data-g="${esc(cat || '未分类')}" title="整组下移">▼</button></span></div>`;
      for(const it of arr){
        h += `<div class="it${it.id===curId?' on':''}" data-id="${esc(it.id)}">
          <span class="nm" title="${esc(it.id)}">${esc(it.name)}</span>
          <span class="mv">
            <button data-mv="up" data-id="${esc(it.id)}" title="上移">▲</button>
            <button data-mv="down" data-id="${esc(it.id)}" title="下移">▼</button>
            <button data-del="${esc(it.id)}" class="del" title="删除">✕</button>
          </span>
        </div>`;
        idx++;
      }
    }
    $('#list').innerHTML = h || '<div class="empty">还没有工作流，先导入一个</div>';
    $('#list').querySelectorAll('.it').forEach(el=>{
      el.onclick = e=>{
        if(e.target.dataset.mv) return;
        openItem(el.dataset.id);
      };
    });
    $('#list').querySelectorAll('[data-mv]').forEach(b=>{
      b.onclick = async e=>{
        e.stopPropagation();
        await api('/api/admin/reorder', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id:b.dataset.id, dir:b.dataset.mv})
        });
        loadList();
      };
    });
    $('#list').querySelectorAll('[data-gmv]').forEach(b=>{
      b.onclick = async e=>{
        e.stopPropagation();
        await api('/api/admin/group-move', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ name: b.dataset.g, dir: b.dataset.gmv })
        });
        loadList();
      };
    });
    $('#list').querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = async e=>{
        e.stopPropagation();
        const id = b.dataset.del;
        if(!confirm('确定永久删除这个工作流？\n\n' + id + '\n\n工作流文件和界面配置会被直接删除，无法恢复。')) return;
        try{
          await api('/api/admin/delete', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id })
          });
          if(curId === id){
            curId = null;
            $('#editor').innerHTML = '<div class="empty">已删除，从左边再选一个</div>';
          }
          loadList();
        }catch(err){ alert(err.message); }
      };
    });
  }catch(e){
    $('#list').innerHTML = `<div class="empty">${esc(e.message)}<br><br>
      <span style="font-size:12px;line-height:1.8">管理页只能在本机或局域网打开：<br>
      <b>http://127.0.0.1:8899/admin</b></span></div>`;
  }
}

async function openItem(id){
  curId = id;
  $('#list').querySelectorAll('.it').forEach(el=>el.classList.toggle('on', el.dataset.id===id));
  $('#editor').innerHTML = '<div class="empty">读取中…</div>';
  try{
    const d = await api('/api/admin/detail?id=' + encodeURIComponent(id));
    curFields = d.fields;
    renderEditor(d);
  }catch(e){
    $('#editor').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderEditor(d){
  curMeta = { id: d.id, title: d.title, category: d.category, order: d.order };
  const selCount = d.fields.filter(f=>f.selected).length;
  let rows = '';
  d.fields.forEach((f, i)=>{
    const kindCls = f.kind;
    let cell;
    if(f.kind === 'toggle'){
      const on = String(f.value).toLowerCase() === 'true' || f.value === true;
      cell = `<div class="sw${on?' on':''}" data-def="${i}"></div>`;
    }else if(f.kind === 'select' && f.choices && f.choices.length){
      const cur = String(f.value);
      const list = f.choices.map(String);
      if(!list.includes(cur)) list.unshift(cur);
      cell = `<select data-def="${i}">` + list.map(c =>
        `<option value="${esc(c)}"${c===cur?' selected':''}>${esc(c)}</option>`).join('') + '</select>';
    }else if(f.kind === 'number'){
      cell = `<input type="number" step="any" data-def="${i}" value="${esc(f.value)}">`;
    }else{
      cell = `<input type="text" data-def="${i}" value="${esc(f.value)}">`;
    }
    const ordCell = f.selected
      ? `<td class="o"><span class="ord"><button data-od="${i}" data-dir="-1" title="前移">▲</button><button data-od="${i}" data-dir="1" title="后移">▼</button></span></td>`
      : '<td class="o"></td>';
    rows += `<tr class="${f.selected?'sel':''}" data-i="${i}">
      <td class="c"><input type="checkbox" data-sel="${i}"${f.selected?' checked':''}></td>
      ${ordCell}
      <td class="n"><input type="text" data-lab="${i}" value="${esc(f.label)}" placeholder="显示名"></td>
      <td class="k">${esc(f.key)}</td>
      <td class="t">${esc(kindCls)}${f.multi?'·多行':''}</td>
      <td class="v">${cell}</td>
    </tr>`;
  });

  $('#editor').innerHTML = `
    <div class="scroll">
    <div class="grid3">
      <div><label>显示名称</label><input type="text" id="fTitle" value="${esc(d.title)}"></div>
      <div><label>分类（手机端分组）</label><input type="text" id="fCat" list="catList" value="${esc(d.category)}" placeholder="留空 = 未分类">
        <datalist id="catList">${[...new Set(items.map(i=>i.category))].filter(Boolean).map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      </div>
      <div><label>排序值（小的在前）</label><input type="number" id="fOrder" value="${esc(d.order)}"></div>
    </div>
    <h2>参数选择 <span class="cnt">已选 ${selCount} / ${d.fields.length}，勾选的会出现在手机上</span></h2>
    <table>
      <thead><tr><th></th><th>顺序</th><th>手机上显示为</th><th>字段</th><th>类型</th><th>默认值</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="bar">
      <button class="btn" id="saveBtn">保存并生效</button>
      <button class="btn ghost" id="reloadBtn">放弃修改</button>
      <span class="msg" id="msg"></span>
    </div>`;

  const syncRow = i=>{
    const cb = $(`[data-sel="${i}"]`);
    const tr = cb.closest('tr');
    tr.classList.toggle('sel', cb.checked);
    const o = tr.querySelector('td.o');
    if(o){
      o.innerHTML = cb.checked
        ? `<span class="ord"><button data-od="${i}" data-dir="-1" title="前移">▲</button><button data-od="${i}" data-dir="1" title="后移">▼</button></span>`
        : '';
      o.querySelectorAll('[data-od]').forEach(b=>{
        b.onclick = ()=> moveField(+b.dataset.od, +b.dataset.dir);
      });
    }
    const n = d.fields.filter((_,k)=>$(`[data-sel="${k}"]`).checked).length;
    $('.cnt').textContent = `已选 ${n} / ${d.fields.length}，勾选的会出现在手机上`;
  };
  $('#editor').querySelectorAll('[data-sel]').forEach(cb=>{
    cb.onchange = ()=> syncRow(+cb.dataset.sel);
  });
  $('#editor').querySelectorAll('[data-od]').forEach(b=>{
    b.onclick = ()=> moveField(+b.dataset.od, +b.dataset.dir);
  });
  $('#editor').querySelectorAll('.sw').forEach(sw=>{
    sw.onclick = ()=>{ sw.classList.toggle('on'); };
  });

  $('#saveBtn').onclick = save;
  $('#reloadBtn').onclick = ()=> openItem(d.id);
}

function collect(){
  $('#editor').querySelectorAll('[data-sel]').forEach(cb=>{
    const i = +cb.dataset.sel;
    curFields[i].selected = cb.checked;
    curFields[i].label = $(`[data-lab="${i}"]`).value;
    const sw = $(`[data-def="${i}"].sw`);
    const inp = $(`[data-def="${i}"]`);
    if(sw) curFields[i].value = sw.classList.contains('on');
    else if(inp) curFields[i].value = inp.value;
  });
  return {
    title: $('#fTitle').value,
    category: $('#fCat').value,
    order: Number($('#fOrder').value) || 0
  };
}

function moveField(i, dir){
  const meta = collect();
  Object.assign(curMeta, meta);
  const sel = curFields.map((f, k)=>k).filter(k=>curFields[k].selected);
  const pos = sel.indexOf(i);
  if(pos < 0) return;
  const t = pos + dir;
  if(t < 0 || t >= sel.length) return;
  const a = sel[pos], b = sel[t];
  const tmp = curFields[a];
  curFields[a] = curFields[b];
  curFields[b] = tmp;
  const sc = $('.scroll');
  const top = sc ? sc.scrollTop : 0;
  renderEditor({ id: curMeta.id, title: curMeta.title, category: curMeta.category,
                 order: curMeta.order, fields: curFields });
  const ns = $('.scroll');
  if(ns) ns.scrollTop = top;
  const m = $('#msg');
  if(m){ m.textContent = '顺序已调整，记得保存'; m.style.color = 'var(--warn)'; }
}

async function save(){
  if(!curId) return;
  const fields = [];
  $('#editor').querySelectorAll('[data-sel]').forEach(cb=>{
    const i = +cb.dataset.sel;
    const lab = $(`[data-lab="${i}"]`).value;
    const sw = $(`[data-def="${i}"].sw`);
    const inp = $(`[data-def="${i}"]`);
    let def = null;
    if(sw) def = sw.classList.contains('on');
    else if(inp) def = inp.value;
    fields.push({key: curFields[i].key, selected: cb.checked, label: lab, default: def, kind: curFields[i].kind});
  });
  const payload = {
    id: curId,
    title: $('#fTitle').value,
    category: $('#fCat').value,
    order: Number($('#fOrder').value) || 0,
    fields
  };
  const btn = $('#saveBtn');
  btn.disabled = true;
  try{
    await api('/api/admin/save', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    msg('已保存，手机端刷新即生效');
    loadList();
  }catch(e){
    msg(e.message, true);
  }finally{
    btn.disabled = false;
  }
}

$('#impBtn').onclick = ()=> $('#impFile').click();

$('#refreshBtn').onclick = async ()=>{
  const btn = $('#refreshBtn');
  const hint = $('#refHint');
  btn.disabled = true;
  hint.innerHTML = '刷新中…';
  try{
    const d = await api('/api/admin/refresh-info', { method:'POST' });
    hint.innerHTML = d.comfy
      ? '节点信息已刷新，重新点开工作流就能看到最新模型列表'
      : '缓存已清空，但连不上 ComfyUI：先把 ComfyUI 开起来再刷新一次';
    hint.style.color = d.comfy ? 'var(--ok)' : 'var(--warn)';
    if(curId) openItem(curId);
  }catch(e){
    hint.textContent = e.message;
    hint.style.color = '#ff8a8a';
  }finally{
    btn.disabled = false;
  }
};
$('#impFile').onchange = async e=>{
  const files = [...e.target.files];
  if(!files.length) return;
  const cat = $('#impCat').value.trim();
  let ok = 0, fail = [];
  for(const f of files){
    try{
      const text = await f.text();
      await api('/api/admin/import', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({data: text, filename: f.name, category: cat})
      });
      ok++;
    }catch(err){ fail.push(f.name + '：' + err.message); }
  }
  e.target.value = '';
  await loadList();
  if(fail.length) alert(`成功 ${ok} 个，失败 ${fail.length} 个：\n` + fail.join('\n'));
  else alert(`已导入 ${ok} 个工作流`);
};

async function loadInfo(){
  try{
    const d = await api('/api/info');
    const a = d.addresses || {};
    const ts = (a.tailscale || [])[0];
    const lan = (a.lan || [])[0];
    let best = ts ? `http://${ts}:${d.port}` : (lan ? `http://${lan}:${d.port}` : '');
    if(best && d.token) best += '/?t=' + d.token;
    $('#addr').textContent = best || location.host;
    if(best) $('#addr').title = (ts ? 'Tailscale 地址（走外网用这个）' : '局域网地址') + '，手机用这个完整地址打开一次';
  }catch(e){
    $('#addr').textContent = location.host;
  }
}
loadInfo();
loadList();
</script>
</body>
</html>
