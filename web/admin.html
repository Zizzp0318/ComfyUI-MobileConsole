<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080d">
<title>ComfyUI 控制台 · 管理</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0A0A11; --text:#F2F2F7; --dim:#9A9AA8; --dim2:#767684;
    --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.11);
    --sheen:linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.028));
    --stroke:rgba(255,255,255,.11); --stroke2:rgba(255,255,255,.2);
    --accent:#6D8CFF; --accent2:#A78BFA; --ok:#3ECF8E; --warn:#FFB44D; --danger:#FF6B6B;
    --r:18px; --r2:14px; --blur:blur(22px) saturate(160%);
  }
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);min-height:100%;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(50vw 46vw at 2% -6%, rgba(109,140,255,.40), transparent 60%),
      radial-gradient(44vw 40vw at 104% 2%, rgba(167,139,250,.32), transparent 62%),
      radial-gradient(50vw 36vw at 96% 76%, rgba(88,116,255,.20), transparent 66%),
      radial-gradient(80vw 40vw at 50% 110%, rgba(109,140,255,.22), transparent 72%),
      var(--bg)}
  .glass{background:var(--sheen);border:1px solid var(--stroke);border-radius:var(--r);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 12px 34px rgba(0,0,0,.28)}
  .app{position:relative;z-index:1;display:grid;grid-template-columns:302px 1fr;
    grid-template-rows:1fr auto;height:100dvh}

  aside{grid-row:1 / span 2;display:flex;flex-direction:column;min-height:0;
    border-right:1px solid var(--stroke);background:rgba(10,10,16,.42);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .brand{padding:16px 18px 12px;font-size:15px;font-weight:600;letter-spacing:.2px}
  .brand span{color:var(--dim2);font-weight:400;font-size:12px;margin-left:6px}
  .addr{padding:0 18px 12px;font-size:11px;color:var(--dim2);display:flex;align-items:center;gap:8px}
  .addr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .addr code{color:var(--accent);font-size:11px}
  .addr button{flex:none;background:rgba(255,255,255,.06);border:1px solid var(--stroke);
    color:var(--dim);font:inherit;font-size:10px;padding:3px 8px;border-radius:7px;cursor:pointer}
  .addr button:hover{color:var(--text);border-color:var(--stroke2)}
  .tools{margin:0 12px 10px;padding:12px;border-radius:var(--r2);
    background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
  .tools .row{display:flex;gap:8px;margin-bottom:8px}
  .tools .row:last-child{margin-bottom:0}
  .tools .hint{font-size:11px;color:var(--dim2);line-height:1.6;margin-top:8px}

  input[type=text],input[type=number],select{
    width:100%;background:rgba(0,0,0,.26);border:1px solid var(--stroke);border-radius:11px;
    color:var(--text);padding:8px 11px;font:inherit;font-size:13px;outline:none;
    transition:border-color .15s, box-shadow .15s}
  input:focus,select:focus{border-color:rgba(109,140,255,.6);box-shadow:0 0 0 3px rgba(109,140,255,.14)}
  select{appearance:none;-webkit-appearance:none;padding-right:30px;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%239A9AA8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 11px center}

  .btn{border:1px solid transparent;border-radius:11px;padding:9px 15px;font:inherit;font-size:13px;
    font-weight:500;color:#fff;background:var(--accent);cursor:pointer;
    background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));
    box-shadow:0 6px 18px rgba(109,140,255,.3), inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .12s, opacity .15s;white-space:nowrap}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.45;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border-color:var(--stroke);
    box-shadow:none;background-image:none}
  .btn.ghost:hover{background:rgba(255,255,255,.1)}

  .searchwrap{margin:0 12px 8px}
  .searchwrap input{padding-left:30px;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 13 13'%3E%3Ccircle cx='5.4' cy='5.4' r='4' fill='none' stroke='%2371717F' stroke-width='1.4'/%3E%3Cpath d='M8.6 8.6l3 3' stroke='%2371717F' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:11px center}

  #list{flex:1;overflow:auto;padding:4px 12px 16px;min-height:0}
  #list::-webkit-scrollbar,.pane::-webkit-scrollbar,.pv-body::-webkit-scrollbar{width:8px}
  #list::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb,.pv-body::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.12);border-radius:8px}
  .grp{display:flex;align-items:center;gap:6px;color:var(--dim2);font-size:11px;
    padding:12px 6px 6px;letter-spacing:.04em}
  .grp .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent)}
  .grp .gmv{display:flex;gap:3px}
  .grp .gmv button{width:18px;height:16px;font-size:9px;line-height:1;padding:0;
    background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--dim2);
    border-radius:4px;cursor:pointer}
  .grp .gmv button:hover{color:var(--text);border-color:var(--stroke2)}
  .it{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:11px;cursor:pointer;
    border:1px solid transparent;transition:.12s}
  .it:hover{background:rgba(255,255,255,.06)}
  .it.on{background:rgba(109,140,255,.16);border-color:rgba(109,140,255,.35)}
  .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .it .mv{display:flex;gap:2px;opacity:0;transition:opacity .15s}
  .it:hover .mv,.it.on .mv{opacity:1}
  .it .mv button{width:17px;height:17px;font-size:9px;line-height:1;padding:0;
    background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--dim);
    border-radius:4px;cursor:pointer}
  .it .mv button:hover{color:var(--text);border-color:var(--stroke2)}
  .it .mv .del:hover{color:#FF9B9B;border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.12)}

  section.pane{min-width:0;min-height:0;overflow:auto;padding:18px 22px 22px;
    grid-column:2;grid-row:1}
  .empty{color:var(--dim2);text-align:center;padding:60px 20px;line-height:1.9;font-size:13px}

  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);margin-bottom:14px}
  .card .hd{display:flex;align-items:center;gap:9px;padding:14px 18px 0}
  .card .hd h2{margin:0;font-size:13px;font-weight:500;color:var(--dim);letter-spacing:.04em;flex:1}
  .card .hd .bar{width:3px;height:13px;border-radius:2px;background:var(--accent);flex:none}
  .card .bd{padding:14px 18px 18px}

  .grid3{display:grid;grid-template-columns:1fr 240px 120px;gap:14px}
  .grid3 label{display:block;font-size:11px;color:var(--dim2);margin-bottom:6px}

  .filters{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .filters .sw{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
    padding:7px 13px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);
    cursor:pointer;white-space:nowrap}
  .filters .sw .dotm{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
  .filters .sw.on{color:#fff;border-color:rgba(109,140,255,.5);background:rgba(109,140,255,.14)}
  .filters .sw.on .dotm{background:var(--accent)}
  .filters .cnt{font-size:11px;color:var(--dim2);margin-left:auto}

  .fhead,.frow{display:grid;grid-template-columns:26px 26px 1fr 168px 74px 170px 56px;
    gap:10px;align-items:center}
  .fhead{padding:0 10px 8px;font-size:11px;color:var(--dim2)}
  .frow{padding:9px 10px;border-radius:12px;border:1px solid transparent;transition:.12s}
  .frow:hover{background:rgba(255,255,255,.04)}
  .frow.sel{background:rgba(109,140,255,.09);border-color:rgba(109,140,255,.22)}
  .frow.over{background:rgba(109,140,255,.2);border-color:rgba(109,140,255,.5)}
  .frow.dragging{opacity:.4}
  .frow .drag{color:var(--dim2);font-size:13px;cursor:grab;text-align:center;user-select:none}
  .frow .ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
  .frow .key{font-size:11px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .kind{font-size:11px;color:var(--dim2);white-space:nowrap}
  .frow .kind i{font-style:normal;color:var(--accent2)}
  .frow .ord{display:flex;gap:3px;justify-content:flex-end}
  .frow .ord button{width:22px;height:20px;font-size:10px;line-height:1;padding:0;
    background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--dim2);
    border-radius:5px;cursor:pointer}
  .frow .ord button:hover{color:var(--text);border-color:var(--stroke2)}
  .frow .def input,.frow .def select{font-size:12px;padding:6px 9px;border-radius:9px}

  .sw2{position:relative;width:34px;height:19px;background:rgba(255,255,255,.16);border-radius:10px;
    cursor:pointer;transition:.15s;display:inline-block;vertical-align:middle}
  .sw2::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#fff;transition:.15s}
  .sw2.on{background:var(--accent)}
  .sw2.on::after{left:17px}

  .bar2{grid-column:2;display:flex;align-items:center;gap:10px;padding:12px 22px;
    border-top:1px solid var(--stroke);background:rgba(10,10,16,.7);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .bar2 .note{font-size:12px;color:var(--dim2);margin-left:auto}

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(8px);
    background:rgba(28,28,38,.94);backdrop-filter:var(--blur);border:1px solid var(--stroke2);
    color:#fff;padding:10px 18px;border-radius:13px;font-size:13px;opacity:0;transition:.2s;
    pointer-events:none;z-index:90;max-width:70vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 手机端预览 */
  .pv{position:fixed;inset:0;z-index:80;background:rgba(4,4,8,.72);
    backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
  .pv.on{display:flex}
  .pv-inner{width:352px;max-height:88dvh;display:flex;flex-direction:column;
    background:#08080d;border:1px solid var(--stroke2);border-radius:34px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1)}
  .pv-top{flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;border-bottom:1px solid var(--stroke);font-size:13px;color:var(--dim)}
  .pv-top button{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer}
  .pv-body{flex:1;overflow:auto;padding:12px 12px 20px;min-height:0}
  .pv-sec{margin-bottom:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.055);
    border:1px solid var(--stroke)}
  .pv-sec .t{font-size:11px;color:var(--dim2);margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .pv-sec .t .b{width:3px;height:11px;border-radius:2px;background:var(--accent)}
  .pv-f{font-size:11px;color:var(--dim);margin-bottom:5px}
  .pv-box{background:rgba(0,0,0,.26);border:1px solid var(--stroke);border-radius:11px;
    padding:9px 11px;font-size:13px;color:var(--text);margin-bottom:10px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-box.ta{white-space:normal;line-height:1.5;color:var(--dim);min-height:52px}
  .pv-pick{border:1px dashed var(--stroke2);border-radius:12px;padding:20px;text-align:center;
    color:var(--dim2);font-size:12px;margin-bottom:10px}
  .pv-ratios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
  .pv-ratios span{text-align:center;font-size:10px;color:var(--dim);border:1px solid var(--stroke);
    border-radius:9px;padding:7px 2px}
  .pv-btn{background:var(--accent);color:#fff;text-align:center;border-radius:12px;padding:12px;
    font-size:14px;font-weight:500;box-shadow:0 6px 18px rgba(109,140,255,.35)}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="app">
  <aside>
    <div class="brand">ComfyUI 控制台<span>管理</span></div>
    <div class="addr"><span>手机端 <code id="addr">—</code></span>
      <button id="copyAddr" title="复制手机端地址">复制</button></div>

    <div class="tools">
      <div class="row">
        <input type="text" id="impCat" placeholder="分类（可留空）">
        <button class="btn" id="impBtn" style="flex:none">导入</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="refreshBtn" style="flex:1">刷新节点信息</button>
      </div>
      <div class="hint" id="hint">导入 ComfyUI「导出(API)」的 json。装了新模型或 LoRA 后点「刷新节点信息」。</div>
      <input type="file" id="impFile" accept=".json,application/json" multiple hidden>
    </div>

    <div class="searchwrap"><input type="text" id="q" placeholder="搜索工作流"></div>
    <div id="list"><div class="empty">加载中…</div></div>
  </aside>

  <section class="pane" id="pane">
    <div class="empty">从左边选一个工作流开始配置</div>
  </section>

  <div class="bar2" id="bar" style="display:none">
    <button class="btn" id="saveBtn">保存并生效</button>
    <button class="btn ghost" id="resetBtn">放弃修改</button>
    <button class="btn ghost" id="previewBtn">预览手机端</button>
    <span class="note" id="note"></span>
  </div>
</div>

<div class="pv" id="pv">
  <div class="pv-inner">
    <div class="pv-top"><span>手机端预览</span><button id="pvClose">关闭</button></div>
    <div class="pv-body" id="pvBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let items = [], curId = null, curFields = [], curMeta = {}, filterText = '', onlySel = false;
const KIND = { text:'文本', number:'数字', select:'下拉', toggle:'开关', image:'图片', video:'视频' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(el._h); el._h = setTimeout(()=>el.classList.remove('show'), 2200);
}
function api(path, opt){
  return fetch(path, opt).then(async r=>{
    const t = await r.text();
    let d; try{ d = JSON.parse(t); }catch(e){ throw new Error(t.slice(0,200) || ('HTTP '+r.status)); }
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    return d;
  });
}

/* ==================== 列表 ==================== */
async function loadList(){
  try{
    const d = await api('/api/admin/list');
    items = d.items;
    renderList();
    if(!curId && items.length) openItem(items[0].id);
  }catch(e){
    $('#list').innerHTML = `<div class="empty">${esc(e.message)}<br><br>
      管理页只能在本机或局域网打开<br><b style="color:var(--accent)">http://127.0.0.1:8899/admin</b></div>`;
  }
}

function renderList(){
  const q = filterText.trim().toLowerCase();
  const hit = q ? items.filter(i => (i.name + ' ' + i.category).toLowerCase().includes(q)) : items;
  const groups = new Map();
  hit.forEach(it => {
    const k = it.category || '未分类';
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  });
  let h = '';
  for(const [cat, arr] of groups){
    h += `<div class="grp"><span>${esc(cat)}</span><span class="line"></span>
      <span class="gmv"><button data-gmv="up" data-g="${esc(cat)}" title="整组上移">▲</button>
      <button data-gmv="down" data-g="${esc(cat)}" title="整组下移">▼</button></span></div>`;
    for(const it of arr){
      h += `<div class="it${it.id===curId?' on':''}" data-id="${esc(it.id)}">
        <span class="nm" title="${esc(it.id)}">${esc(it.name)}</span>
        <span class="mv">
          <button data-mv="up" data-id="${esc(it.id)}" title="上移">▲</button>
          <button data-mv="down" data-id="${esc(it.id)}" title="下移">▼</button>
          <button data-del="${esc(it.id)}" class="del" title="删除">✕</button>
        </span></div>`;
    }
  }
  $('#list').innerHTML = h || '<div class="empty">还没有工作流，先导入一个</div>';

  $('#list').querySelectorAll('.it').forEach(el => {
    el.onclick = e => { if(e.target.dataset.mv) return; openItem(el.dataset.id); };
  });
  $('#list').querySelectorAll('[data-mv]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      try{
        await api('/api/admin/reorder', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: b.dataset.id, dir: b.dataset.mv }) });
        loadList();
      }catch(err){ toast(err.message); }
    };
  });
  $('#list').querySelectorAll('[data-gmv]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      try{
        await api('/api/admin/group-move', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ name: b.dataset.g, dir: b.dataset.gmv }) });
        loadList();
      }catch(err){ toast(err.message); }
    };
  });
  $('#list').querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      const id = b.dataset.del;
      if(!confirm('永久删除这个工作流？\n\n' + id + '\n\n工作流文件和界面配置都会被删除，无法恢复。')) return;
      try{
        await api('/api/admin/delete', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id }) });
        if(curId === id){
          curId = null;
          $('#pane').innerHTML = '<div class="empty">已删除，从左边再选一个</div>';
          $('#bar').style.display = 'none';
        }
        toast('已删除');
        loadList();
      }catch(err){ toast(err.message); }
    };
  });
}

$('#q').oninput = e => { filterText = e.target.value; renderList(); };

/* ==================== 编辑器 ==================== */
async function openItem(id){
  curId = id;
  renderList();
  $('#pane').innerHTML = '<div class="empty">读取中…</div>';
  try{
    const d = await api('/api/admin/detail?id=' + encodeURIComponent(id));
    curFields = d.fields;
    filterText = ''; $('#q').value = ''; onlySel = false;
    renderEditor(d);
  }catch(e){
    $('#pane').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderEditor(d){
  curMeta = { id: d.id, title: d.title, category: d.category, order: d.order };
  const selCount = curFields.filter(f => f.selected).length;
  $('#bar').style.display = 'flex';
  $('#note').textContent = `${selCount} 个参数会出现在手机上`;

  const cats = [...new Set(items.map(i => i.category).filter(Boolean))];

  $('#pane').innerHTML = `
    <div class="card"><div class="hd"><span class="bar"></span><h2>基本信息</h2></div>
      <div class="bd"><div class="grid3">
        <div><label>显示名称</label><input type="text" id="fTitle" value="${esc(d.title)}"></div>
        <div><label>分类（手机端分组）</label>
          <input type="text" id="fCat" list="catList" value="${esc(d.category)}" placeholder="留空 = 未分类">
          <datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <div><label>排序值（小的在前）</label><input type="number" id="fOrder" value="${esc(d.order)}"></div>
      </div></div></div>

    <div class="card"><div class="hd"><span class="bar"></span><h2>参数列表</h2>
      <span style="font-size:11px;color:var(--dim2);white-space:nowrap">拖动手柄可排序</span></div>
      <div class="bd">
        <div class="filters">
          <input type="text" id="fq" placeholder="按名称或字段名筛选" style="max-width:260px">
          <div class="sw${onlySel?' on':''}" id="onlySel"><span class="dotm"></span>只看已选</div>
          <span class="cnt" id="cnt"></span>
        </div>
        <div class="fhead"><span></span><span></span><span>手机上显示为</span><span>字段</span>
          <span>类型</span><span>默认值</span><span style="text-align:right">顺序</span></div>
        <div id="rows"></div>
      </div></div>`;
  renderRows();
  renderNote();
}

function renderNote(){
  const selCount = curFields.filter(f => f.selected).length;
  const el = $('#note'); if(el) el.textContent = `${selCount} 个参数会出现在手机上`;
  const c = $('#cnt');
  if(c) c.textContent = `共 ${curFields.length} 个字段，已选 ${selCount} 个`;
}

function renderRows(){
  const q = filterText.trim().toLowerCase();
  let rows = '';
  curFields.forEach((f, i) => {
    if(onlySel && !f.selected) return;
    if(q && !((f.label||'') + ' ' + f.key).toLowerCase().includes(q)) return;
    let cell;
    if(f.kind === 'toggle'){
      const on = String(f.value).toLowerCase() === 'true' || f.value === true;
      cell = `<div class="sw2${on?' on':''}" data-def="${i}"></div>`;
    }else if(f.kind === 'select' && f.choices && f.choices.length){
      const cur = String(f.value);
      const list = f.choices.map(String);
      if(!list.includes(cur)) list.unshift(cur);
      cell = `<select data-def="${i}">` + list.map(c =>
        `<option value="${esc(c)}"${c===cur?' selected':''}>${esc(c)}</option>`).join('') + '</select>';
    }else if(f.kind === 'number'){
      cell = `<input type="number" step="any" data-def="${i}" value="${esc(f.value)}">`;
    }else{
      cell = `<input type="text" data-def="${i}" value="${esc(f.value)}">`;
    }
    rows += `<div class="frow${f.selected?' sel':''}" data-i="${i}" draggable="true">
      <span class="drag" title="拖动排序">⠿</span>
      <input type="checkbox" class="ck" data-sel="${i}"${f.selected?' checked':''}>
      <input type="text" data-lab="${i}" value="${esc(f.label)}" placeholder="显示名">
      <span class="key" title="${esc(f.key)}">${esc(f.key)}</span>
      <span class="kind">${esc(KIND[f.kind] || f.kind)}${f.multi?'<i> ·多行</i>':''}</span>
      <div class="def">${cell}</div>
      <div class="ord"><button data-up="${i}" title="上移">▲</button><button data-dn="${i}" title="下移">▼</button></div>
    </div>`;
  });
  $('#rows').innerHTML = rows || '<div class="empty" style="padding:30px">没有匹配的字段</div>';
  bindRows();
  renderNote();
}

function bindRows(){
  $('#rows').querySelectorAll('[data-sel]').forEach(cb => {
    cb.onchange = () => {
      const i = +cb.dataset.sel;
      curFields[i].selected = cb.checked;
      const row = cb.closest('.frow');
      row.classList.toggle('sel', cb.checked);
      renderNote();
    };
  });
  $('#rows').querySelectorAll('[data-up]').forEach(b => b.onclick = () => moveField(+b.dataset.up, -1));
  $('#rows').querySelectorAll('[data-dn]').forEach(b => b.onclick = () => moveField(+b.dataset.dn, 1));

  $('#rows').querySelectorAll('.sw2').forEach(sw => {
    sw.onclick = () => {
      sw.classList.toggle('on');
      const i = +sw.dataset.def;
      curFields[i].value = sw.classList.contains('on');
    };
  });

  let dragIdx = null;
  $('#rows').querySelectorAll('.frow').forEach(row => {
    row.ondragstart = e => {
      dragIdx = +row.dataset.i;
      row.classList.add('dragging');
      if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', String(dragIdx)); }catch(err){} }
    };
    row.ondragend = () => {
      row.classList.remove('dragging');
      $('#rows').querySelectorAll('.frow').forEach(x => x.classList.remove('over'));
    };
    row.ondragover = e => { e.preventDefault(); row.classList.add('over'); };
    row.ondragleave = () => row.classList.remove('over');
    row.ondrop = e => {
      e.preventDefault();
      row.classList.remove('over');
      const to = +row.dataset.i;
      if(dragIdx === null || dragIdx === to) return;
      curFields[dragIdx].selected = true;
      const [it] = curFields.splice(dragIdx, 1);
      curFields.splice(to, 0, it);
      dragIdx = null;
      renderRows();
    };
  });

  const fq = $('#fq');
  if(fq){
    fq.value = filterText;
    fq.oninput = () => { filterText = fq.value; renderRows(); };
  }
  const os = $('#onlySel');
  if(os){
    os.classList.toggle('on', onlySel);
    os.onclick = () => { onlySel = !onlySel; os.classList.toggle('on', onlySel); renderRows(); };
  }
}

function moveField(i, dir){
  const sel = curFields.map((f, k) => k).filter(k => curFields[k].selected);
  const pos = sel.indexOf(i);
  if(pos < 0) return;
  const t = pos + dir;
  if(t < 0 || t >= sel.length) return;
  const a = sel[pos], b = sel[t];
  const tmp = curFields[a];
  curFields[a] = curFields[b];
  curFields[b] = tmp;
  renderRows();
}

/* ==================== 保存 ==================== */
async function save(){
  if(!curId) return;
  const rows = $('#rows');
  // 按 curFields 全量构建，不能只读当前渲染出来的行——筛选或「只看已选」时，
  // 没渲染的字段会漏掉，保存后就变成未勾选了
  const fields = curFields.map((f, i) => {
    const cb = rows.querySelector(`[data-sel="${i}"]`);
    const lab = rows.querySelector(`[data-lab="${i}"]`);
    const sw = rows.querySelector(`[data-def="${i}"].sw2`);
    const inp = rows.querySelector(`[data-def="${i}"]`);
    let def = f.value;
    if(sw) def = sw.classList.contains('on');
    else if(inp) def = inp.value;
    f.selected = cb ? cb.checked : f.selected;
    f.label = lab ? lab.value : f.label;
    f.value = def;
    return { key: f.key, selected: f.selected, label: f.label, default: def, kind: f.kind };
  });
  const btn = $('#saveBtn');
  btn.disabled = true;
  try{
    await api('/api/admin/save', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        id: curId,
        title: $('#fTitle').value,
        category: $('#fCat').value,
        order: Number($('#fOrder').value) || 0,
        fields
      })
    });
    toast('已保存，手机端刷新即生效');
    curMeta.title = $('#fTitle').value;
    loadList();
  }catch(e){
    toast(e.message);
  }finally{
    btn.disabled = false;
  }
}

$('#saveBtn').onclick = save;
$('#resetBtn').onclick = () => { if(curId) openItem(curId); };

/* ==================== 预览 ==================== */
$('#previewBtn').onclick = () => {
  if(!curId){ toast('先选一个工作流'); return; }
  const sel = curFields.filter(f => f.selected);
  const title = $('#fTitle').value || curMeta.title || '工作流';

  // 和手机端同一套分区规则，并按管理页里的排序决定分区先后
  const grp = f => f.group || (
    ['image','video'].includes(f.kind) ? 'image'
      : /比例|像素|种子|张数|宽|高/i.test(f.label) ? 'size'
        : /提示词|prompt/i.test(f.label) ? 'prompt' : 'advanced');
  const buckets = [
    { t: '提示词', arr: sel.filter(f => grp(f) === 'prompt') },
    { t: '参考素材', arr: sel.filter(f => grp(f) === 'image') },
    { t: '画面与种子', arr: sel.filter(f => grp(f) === 'size' || grp(f) === 'seed') },
  ];
  const used = new Set([].concat(...buckets.map(b => b.arr)));
  buckets.push({ t: '其他参数', arr: sel.filter(f => !used.has(f)) });

  const order = new Map(sel.map((f, i) => [f.key, i]));
  const at = arr => arr.reduce((m, f) => Math.min(m, order.has(f.key) ? order.get(f.key) : 1e9), 1e9);
  buckets.sort((a, b) => at(a.arr) - at(b.arr));

  const groups = buckets.map(b => [b.t, b.arr]);

  let body = `<div style="padding:6px 4px 12px;font-size:15px;font-weight:600">${esc(title)}</div>`;
  for(const [name, arr] of groups){
    if(!arr.length) continue;
    body += `<div class="pv-sec"><div class="t"><span class="b"></span>${name}</div>`;
    for(const f of arr){
      body += `<div class="pv-f">${esc(f.label)}</div>`;
      if(['image','video'].includes(f.kind)){
        body += `<div class="pv-pick">点击选择${f.kind==='video'?'视频':'图片'}</div>`;
      }else if(f.kind === 'select' && f.choices && f.choices.length && f.choices.every(c => /^\s*\d+\s*:\s*\d+/.test(String(c)))){
        body += `<div class="pv-ratios">` + f.choices.slice(0, 8).map(c => {
          const m = String(c).match(/^\s*(\d+)\s*:\s*(\d+)/);
          return `<span>${esc(m[1])}:${esc(m[2])}</span>`;
        }).join('') + `</div>`;
      }else if(f.kind === 'toggle'){
        body += `<div class="pv-box">${(String(f.value)==='true'||f.value===true)?'已开启':'已关闭'}</div>`;
      }else if(f.kind === 'select'){
        body += `<div class="pv-box">${esc(f.value)}</div>`;
      }else if(f.multi){
        body += `<div class="pv-box ta">${esc(f.value) || '在这里输入提示词…'}</div>`;
      }else{
        body += `<div class="pv-box">${esc(f.value)}</div>`;
      }
    }
    body += `</div>`;
  }
  body += `<div class="pv-btn">运行</div>`;
  $('#pvBody').innerHTML = body;
  $('#pv').classList.add('on');
};
$('#pvClose').onclick = () => $('#pv').classList.remove('on');
$('#pv').onclick = e => { if(e.target.id === 'pv') $('#pv').classList.remove('on'); };

/* ==================== 导入 / 刷新 ==================== */
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = async e => {
  const files = [...e.target.files];
  if(!files.length) return;
  const cat = $('#impCat').value.trim();
  let ok = 0, fail = [], last = null;
  for(const f of files){
    try{
      const text = await f.text();
      const r = await api('/api/admin/import', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ data: text, filename: f.name, category: cat }) });
      last = r.id; ok++;
    }catch(err){ fail.push(f.name + '：' + err.message); }
  }
  e.target.value = '';
  await loadList();
  if(last && !fail.length){ openItem(last); toast('已导入并打开：' + last); }
  else if(fail.length) alert(`成功 ${ok} 个，失败 ${fail.length} 个：\n` + fail.join('\n'));
  else toast(`已导入 ${ok} 个工作流`);
};

$('#refreshBtn').onclick = async () => {
  const btn = $('#refreshBtn'), hint = $('#hint');
  btn.disabled = true; hint.textContent = '刷新中…';
  try{
    const d = await api('/api/admin/refresh-info', { method:'POST' });
    hint.textContent = d.comfy
      ? '节点信息已刷新，重新点开工作流即可看到最新模型列表'
      : '缓存已清空，但连不上 ComfyUI：先把 ComfyUI 开起来再刷新一次';
    hint.style.color = d.comfy ? 'var(--ok)' : 'var(--warn)';
    if(curId) openItem(curId);
  }catch(e){
    hint.textContent = e.message; hint.style.color = '#FF9B9B';
  }finally{ btn.disabled = false; }
};

async function loadInfo(){
  try{
    const d = await api('/api/info');
    const a = d.addresses || {};
    const ts = (a.tailscale || [])[0], lan = (a.lan || [])[0];
    let best = ts ? `http://${ts}:${d.port}` : (lan ? `http://${lan}:${d.port}` : '');
    if(best && d.token) best += '/?t=' + d.token;
    $('#addr').textContent = best || location.host;
    $('#addr').title = best || location.host;
    $('#copyAddr').onclick = async () => {
      try{ await navigator.clipboard.writeText(best || location.host); toast('手机端地址已复制'); }
      catch(e){ toast('复制失败，手动选中吧'); }
    };
  }catch(e){ $('#addr').textContent = location.host; }
}

loadInfo();
loadList();
</script>
